<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Details Form</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h2>Customer Details:</h2>
      <form novalidate>
        <div class="flex full-name-section">
          <label for="firstName"
            >Full Name <span class="required">*</span></label
          >
          <div class="name-row">
            <div class="name-field">
              <input
                type="text"
                id="firstName"
                placeholder="First Name"
                required
              />
              <span class="label-small">First Name</span>
            </div>
            <div class="name-field">
              <input
                type="text"
                id="lastName"
                placeholder="Last Name"
                required
              />
              <span class="label-small">Last name</span>
            </div>
          </div>
          <div class="full-name-error-placeholder"></div>
        </div>

        <div class="flex address-section">
          <label for="streetAddress"
            >Address <span class="required">*</span></label
          >
          <input
            type="text"
            id="streetAddress"
            class="address-required"
            placeholder="Street Address"
            required
          />
          <span class="label-small">Street Address</span>
          <input
            type="text"
            id="streetAddress2"
            placeholder="Street Address Line 2"
          />
          <span class="label-small">Street Address Line 2</span>
          <div class="name-row">
            <div class="name-field">
              <input
                type="text"
                id="city"
                class="address-required"
                placeholder="City"
                required
              />
              <span class="label-small">City</span>
            </div>
            <div class="name-field">
              <input
                type="text"
                id="state"
                class="address-required"
                placeholder="State / Province"
                required
              />
              <span class="label-small">State / Province</span>
            </div>
          </div>
          <input
            type="text"
            id="postalCode"
            class="address-required"
            placeholder="Postal / Zip Code"
            required
          />
          <span class="label-small">Postal / Zip Code</span>
          <div class="address-error-placeholder"></div>
        </div>

        <div class="flex phone-section">
          <label>Phone Number <span class="required">*</span></label>
          <input
            class="phone-input"
            type="text"
            placeholder="(000) 000-0000"
            required
          />
          <div class="phone-error-placeholder"></div>
        </div>
        <div class="flex email-section">
          <label>E-mail</label>
          <input type="email" placeholder="ex: email@yahoo.com" />
          <span class="label-small">example@example.com</span>
          <div class="email-error-placeholder"></div>
        </div>

        <hr class="select-separator" />

        <div class="flex hear-about-section">
          <label
            >How did you hear about us? <span class="required">*</span></label
          >
          <select required>
            <option value="" selected hidden>Please Select</option>
            <option value="None">None</option>
            <option>Social Media</option>
            <option>Friend</option>
            <option>Advertisement</option>
            <option>Other(Please Specify...)</option>
          </select>
          <div class="hear-about-error-placeholder"></div>
        </div>
        <div class="flex other">
          <label for="hearAboutUsOther">If other, please specify:</label>
          <input
            type="text"
            id="hearAboutUsOther"
            placeholder="Please specify..."
          />
          <div class="other-error-placeholder"></div>
        </div>
        <div class="hear-about-error-placeholder"></div>

        <label class="feedback-label">Feedback about us:</label>
        <textarea rows="4"></textarea>

        <label>Suggestions if any for further improvement:</label>
        <textarea rows="4"></textarea>

        <label>Will you be willing to recommend us?</label>
        <div class="checkboxes">
          <label><input type="checkbox" /> Yes</label>
          <label><input type="checkbox" /> Maybe</label>
          <label><input type="checkbox" /> No</label>
        </div>

        <label>Please give reference of any two people whom you feel:</label>
        <table>
          <thead>
            <tr>
              <th class="empty-cell"></th>
              <th>Full Name</th>
              <th>Address</th>
              <th>Contact Number</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td><input type="text" /></td>
              <td><input type="text" /></td>
              <td><input type="text" /></td>
            </tr>
            <tr>
              <td>2</td>
              <td><input type="text" /></td>
              <td><input type="text" /></td>
              <td><input type="text" /></td>
            </tr>
          </tbody>
        </table>

        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
